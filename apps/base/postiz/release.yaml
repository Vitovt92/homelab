apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postiz
  namespace: postiz-ns
spec:
  interval: 30m
  chart:
    spec:
      chart: postiz-app
      version: "1.0.5"
      sourceRef:
        kind: HelmRepository
        name: postiz
        namespace: postiz-ns
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
