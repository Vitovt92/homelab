apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-admin-tools-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal-admin-tools
  template:
    metadata:
      labels:
        app: temporal-admin-tools
    spec:
      containers:
        - name: temporal-admin-tools
          image: temporalio/admin-tools:1.28.1-tctl-1.18.4-cli-1.4.1
          envFrom:
            - configMapRef:
                name: temporal-admin-tools-cm

