apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-elasticsearch-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal-elasticsearch-deploy
  template:
    metadata:
      labels:
        app: temporal-elasticsearch-deploy
    spec:
      containers:
        - name: temporal-elasticsearch
          image: elasticsearch:7.17.27
          ports:
            - containerPort: 9200
          volumeMounts:
            - mountPath: /usr/share/elasticsearch/data
              name: temporal-elasticsearch-data
          envFrom:
            - configMapRef:
                name:  temporal-elasticsearch-cm
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1 "
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1 "
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: temporal-elasticsearch-data
          persistentVolumeClaim:
            claimName:  temporal-elasticsearch-data-pvc



