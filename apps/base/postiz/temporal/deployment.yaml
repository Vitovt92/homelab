apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal-deploy
  template:
    metadata:
      labels:
        app: temporal-deploy
    spec:
      containers:
        - name: temporal
          image: temporalio/auto-setup:1.29.7
          ports:
            - containerPort: 7233
          envFrom:
            - configMapRef:
                name: temporal-cm
            - secretRef:
                name: temporal-secrets
          livenessProbe:
            exec:
              command:
                - temporal
                - operator
                - cluster
                - health
                - --address
                - temporal-srv:7233
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - temporal
                - operator
                - cluster
                - health
                - --address
                - temporal-srv:7233      
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3





