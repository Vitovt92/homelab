apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal-deploy
  template:
    metadata:
      labels:
        app: temporal-deploy
    spec:
      containers:
        - name: temporal
          image: temporalio/auto-setup:1.28.1
          ports:
            - containerPort: 7233
          envFrom:
            - configMapRef:
                name: temporal-cm
            - secretRef:
                name: temporal-secrets
          volumeMounts:
            - mountPath: /etc/temporal/config/dynamicconfig
              name: dynamicconfig
          livenessProbe:
            tcpSocket:
              port: 7233
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: 7233
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
      volumes:
        - name: dynamicconfig
          configMap:
            name: temporal-dynamicconfig-cm





