apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: linkding
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-letsencrypt-issuer
spec:
  ingressClassName: traefik
  rules:
    - host: ldpi.holovko.org
      http:
        paths:
          - backend:
              service:
                name: linkding
                port:
                  number: 9090
            path: /
            pathType: Prefix
  tls:
  - hosts:
    - ldpi.holovko.org
    secretName: ldpi-cf-letsencrypt-cert
