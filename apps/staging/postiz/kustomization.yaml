apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: postiz-ns
resources:
  - ../../base/postiz
  - secrets
  - ingress.yaml
patches:
  - path: patches/postiz-app-configmap.yaml
  - path: patches/cf-r2-uploads-add-cm.json
    target:
      kind: Deployment
      name: postiz-deploy
