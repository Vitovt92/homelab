apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  chart:
    spec:
      chart: cert-manager
      version: "1.20.3"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: cert-manager
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    # Install CRDs as part of the Helm release
    crds:
      enabled: true
      # Keep CRDs when the Helm release is uninstalled
      keep: true

    # Number of cert-manager controller replicas
    replicaCount: 2

    # Resource requests and limits for the controller
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

    # Webhook configuration
    webhook:
      replicaCount: 2
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
      podDisruptionBudget:
        enabled: true
        minAvailable: 1

    # CA injector configuration
    cainjector:
      replicaCount: 2
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          cpu: 100m
          memory: 256Mi
      podDisruptionBudget:
        enabled: true
        minAvailable: 1

    # Enable Prometheus metrics
    prometheus:
      enabled: true
      servicemonitor:
        enabled: true
        namespace: cert-manager

    # Pod disruption budgets for high availability
    podDisruptionBudget:
      enabled: true
      minAvailable: 1

    # Global log level (1-5, higher is more verbose)
    global:
      logLevel: 2
