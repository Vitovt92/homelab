apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-tls-secret
  namespace: monitoring
spec:
  # Secret names are always required.
  secretName: grafana-tls-secret
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 4096
  duration: 2160h # 90d
  renewBefore: 360h # 15d
  isCA: false
  usages:
    - server auth
  subject:
    organizations:
      - cert-manager
  dnsNames:
    - grafana.holovko.org
  issuerRef:
    name: cloudflare-letsencrypt-issuer
    kind: ClusterIssuer
