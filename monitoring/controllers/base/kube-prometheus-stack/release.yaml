apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "66.2.2"

      # version: "58.x"

      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack
        namespace: monitoring
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
    ignore:
      # Ignore "validated" annotation which is not inserted during install
      - paths: ["/metadata/annotations/prometheus-operator-validated"]
        target:
          kind: PrometheusRule
  valuesFrom:
    - kind: Secret
      name: grafana-admin-pass-secret
      valuesKey: adminPassword
      targetPath: grafana.adminPassword
  values:
    grafana:
#      adminPassword: tmpPassword
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations: {}
        labels: {}
        hosts:
          - grafana.holovko.org
        path: /
        tls:
          - secretName: grafana-tls-secret
            hosts:
            - grafana.holovko.org
